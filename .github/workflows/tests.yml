name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: End-to-end engine tests
        run: python tests/test_engine.py
      - name: Verify web/py is in sync with automl_core
        run: |
          python build.py
          if ! git diff --quiet -- web/py; then
            echo "::error::web/py is stale. Run 'python build.py' and commit the result."
            git diff --stat -- web/py
            exit 1
          fi
